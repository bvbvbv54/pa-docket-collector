[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pa-docket-collector"
version = "0.1.0"
description = "Offline-first Pennsylvania public docket collection and extraction pipeline"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.115",
  "itsdangerous>=2.2",
  "jinja2>=3.1",
  "openpyxl>=3.1",
  "pdfplumber>=0.11",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.18",
  "pydantic>=2.10",
  "pymupdf>=1.24,<2",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "reportlab>=4.2"]
browser = ["playwright>=1.50"]

[project.scripts]
pa-docket = "pa_docket.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pa_docket"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

